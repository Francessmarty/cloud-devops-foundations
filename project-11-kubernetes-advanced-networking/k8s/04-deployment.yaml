apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-demo
  namespace: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edge-demo
  template:
    metadata:
      labels:
        app: edge-demo
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports:
            - containerPort: 80
          env:
            - name: APP_NAME
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_NAME
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: APP_ENV
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: API_KEY
          # Small “performance” touch: requests/limits so scheduler behaves predictably
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"