#Used for demonstration in Project 7
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run basic CI checks
        run: |
          echo "CI running..."
          ls -la

      - name: Use GitHub Secret (demo)
        run: |
          echo "Secret is set and available"
          echo "Length: ${#LAB_SECRET}"
        env:
          LAB_SECRET: ${{ secrets.LAB_SECRET }}
